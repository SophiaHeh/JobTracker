<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="create-job.js" defer></script>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="main.html">Job Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

        </div>
    </nav>



    <div class="container my-4">
        <h1>New Job Application</h1>
        <form id="jobForm">
            <!-- First row: Company Name & Job Title -->
            <div class="row mb-3">
                <div class="col">
                    <label for="jobTitle" class="form-label">Job Title *</label>
                    <input type="text" class="form-control" id="jobTitle" placeholder="e.g., Senior Developer" required>
                </div>
                <div class="col">
                    <label for="salaryRange" class="form-label">Salary Range</label>
                    <input type="text" class="form-control" id="salaryRange" placeholder="e.g., 80k - 100k">
                </div>
                <div class="col">
                    <label for="jobType" class="form-label">Job Type</label>
                    <select class="form-select" id="jobType">
                        <option value="">Select Job Type</option>
                        <option value="Intern">Intern</option>
                        <option value="Full Time">Full Time</option>
                        <option value="Contractor">Contractor</option>
                    </select>
                </div>

            </div>

            <div class="row mb-3">
                <div class="col">
                    <label for="appliedDate" class="form-label">Applied Date</label>
                    <input type="date" class="form-control" id="appliedDate" value="2025-01-01">
                </div>
                <div class="col">
                    <label for="Status" class="form-label">Status</label>
                    <select class="form-select" id="jobStatus">
                        <option value="Applied">Applied</option>
                        <option value="Interviewed Schedule">Interviewed Schedule</option>
                        <option value="Offered">Offered</option>
                        <option value="Denied"> Denied</option>
                        <option value="Ghosted">Ghosted</option>
                    </select>
                </div>
                <div class="col">
                    <label for="resume" class="form-label">Resume Version</label>
                    <input type="text" class="form-control" id="resume">
                </div>
            </div>



            <div class="row mb-3">
                <div class="col">
                    <label for="company" class="form-label">Company Name *</label>
                    <input type="text" class="form-control" id="companyName" placeholder="Enter the company name"
                        required>
                </div>
                <div class="col">
                    <label for="company" class="form-label">Location</label>
                    <input type="text" class="form-control" id="location" placeholder="Enter the location">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label for="contactor" class="form-label">HR</label>
                    <input type="text" class="form-control" id="HRname" placeholder="Enter HR's Name">
                </div>
                <div class="col">
                    <label for="contactor" class="form-label">Email</label>
                    <input type="email" class="form-control" id="HEemail" placeholder="Enter HR's Email">
                </div>
            </div>

            <div class="mb-3">
                <label for="note" class="form-label">Note</label>
                <textarea class="form-control" id="note" rows="3"
                    placeholder="Additional notes or follow-up actions"></textarea>
            </div>

            <!-- Buttons -->
            <button type="button" class="btn btn-secondary me-2">
                Cancel
            </button>
            <button type="submit" class="btn btn-primary">
                Save
            </button>
        </form>

</body>

</html>
